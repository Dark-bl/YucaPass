name: YucaPass 5.0 · Publicar web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yucapass-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v5
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar el proyecto
        run: npm run check
      - name: Generar web y PWA
        run: npm run build:web
      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
